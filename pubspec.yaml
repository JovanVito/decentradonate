name: decentradonate
description: Aplikasi donasi mikro terdesentralisasi berbasis Polygon Amoy Testnet dengan Proof-of-Impact (Kamera + GPS + IPFS).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Routing ---
  go_router: ^14.2.0

  # --- Immutable Models (dipakai mulai Stage 2) ---
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # --- Functional Error Handling ---
  dartz: ^0.10.1

  # --- Local Database (Stage 2) ---
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # --- Web3 / Blockchain (Stage 2) ---
  web3dart: ^2.7.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  bip39: ^1.0.6
  web_socket_channel: ^3.0.3

  # --- Camera & GPS (Stage 3) ---
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # --- Konektivitas (dipakai dari Stage 1 untuk Error/Empty state) ---
  connectivity_plus: ^6.0.5

  # --- Utilities ---
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code Generation (dijalankan mulai Stage 2) ---
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/contracts/
    - assets/images/
